<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medication Reminder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo">💙 MedReminder</span>
      <button type="button" id="notify-btn">Enable notifications</button>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Medicine Tracker</h1>
        <p>Keep track of your medications with simple reminders.</p>
      </section>

      <section class="stats">
        <div class="stat">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Taken today</span>
          <span class="stat-value green" id="stat-taken">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Pending</span>
          <span class="stat-value orange" id="stat-pending">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Next reminder</span>
          <span class="stat-value purple" id="stat-next">--:--</span>
        </div>
      </section>

      <section class="card">
        <h2>Add medication</h2>
        <form id="med-form">
          <div class="field">
            <label for="name">Medication name</label>
            <input type="text" id="name" required />
          </div>
          <div class="field">
            <label for="dose">Dose</label>
            <input type="text" id="dose" required />
          </div>
          <div class="field">
            <label for="time">Time</label>
            <input type="time" id="time" required />
          </div>
          <div class="field">
            <label for="interval">Repeat every (days)</label>
            <input type="number" id="interval" min="1" value="1" required />
          </div>
          <button type="submit" class="primary">+ Add</button>
        </form>
      </section>

      <h2 class="section-title">Your medications</h2>
      <ul id="med-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
